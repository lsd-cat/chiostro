# One OpenResty server for every app: the bundle in dist/, config.json as data, relay.lua for
# the relay and the store. Rooms are per-worker memory, so exactly one worker.
# Run from the repo root:  mkdir -p openresty/data/{tmp,meet,p2p,when,pad,share,form} && openresty -p openresty -c nginx.conf
worker_processes 1;
error_log stderr warn;
pid nginx.pid;
events { worker_connections 4096; }
http {
  types { text/html html; text/css css; text/javascript js; application/json json; image/svg+xml svg; image/png png; image/webp webp; }
  default_type application/octet-stream;
  access_log off;
  lua_package_path "$prefix/?.lua;$prefix/vendor/?.lua;;";   # relay.lua, s3.lua and the vendored resty modules (websocket, sha256) the role ships too
  lua_code_cache on;
  lua_shared_dict chiostro 2m;   # rate windows and per-room quota cache, all with expiry
  server {
    listen 127.0.0.1:8080;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src blob:; connect-src 'self' https: http://127.0.0.1:*; worker-src 'self'; frame-src 'self' blob: https:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache always;   # revalidate every time, so a build is live on the next reload
    root ../dist;
    include store.conf;   # disk or bucket, see the file
    error_page 404 /errors/404.html; error_page 429 /errors/429.html; error_page 500 502 503 504 /errors/50x.html;
    location ^~ /errors/ { internal; }   # the pages above, only as error responses
    location = / { try_files /index.html =404; }
    location ~ "^/[a-z]+/$" { try_files /index.html =404; }   # every app is the same shell; the path picks the module
    location = /config.json { root ../; try_files /config.json /config.example.json =404; }
    location ~ "^/([a-z0-9-]+/){0,3}[a-z0-9-]+\.(js|css|svg|png|webp)$" { try_files $uri =404; }   # the bundle, the extensions, vendor/tstex/*/*.js, and themes/ (logos)
    location ^~ /texmf/ { alias texmf/; add_header Cache-Control "public, max-age=31536000, immutable"; }   # the TeX Live bundle for PDF export: a symlink to tstex's bundles/minimal (see README)
    location ~ "^/ws/(?<app>[a-z0-9]{2,8})/(?<room>[0-9a-f]{64})$" { content_by_lua_file relay.lua; }
    location ~ "^/blob/(?<app>[a-z0-9]{2,8})/(?<room>[0-9a-f]{64})/(?<slot>[0-9a-f]{8,32}(\.[0-9]{1,6})?|index)$" {
      client_max_body_size 8m;                 # one chunk; the room quota is checked by relay.lua
      client_body_in_file_only on;             # spool to disk next to the store, so a put is a rename
      client_body_temp_path data/tmp;
      content_by_lua_file relay.lua;
    }
    # add_header in a location replaces the server's set: the blob locations repeat nosniff and say "bytes, download" so no blob is ever a page on this origin
    location ^~ /_blob/ { internal; alias data/; add_header Cache-Control "private, max-age=31536000, immutable"; add_header Content-Disposition attachment; add_header X-Content-Type-Options nosniff always; }   # a slot never changes (2xx only: a 404 may become a 200)
    location ^~ /_index/ { internal; alias data/; add_header Cache-Control no-cache always; add_header X-Content-Type-Options nosniff always; }
    location = /_expire { allow 127.0.0.1; deny all; content_by_lua_file expire.lua; }   # the bucket store's daily expiry, called by cron
  }
}
