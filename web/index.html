l="currentColor"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol></svg>
<div id="loading" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span></div>
<header id="hdr">
  <div id="brand"><h1><a id="homelink" href="/"><span id="title"></span></a></h1><small id="hstatus" role="status"></small></div>
  <nav id="nav" data-i18n-aria="otherApps"></nav>
  <span id="site">
    <select class="lang" data-i18n-aria="language"></select>
    <button class="theme icon-btn" data-i18n-aria="theme"><svg class="i" aria-hidden="true"><use href="#i-theme"/></svg></button>
  </span>
  <div id="toolbar" role="toolbar" data-i18n-aria="toolbar">
    <span id="tools"></span>
    <span id="actions">
      <button id="namebox" hidden popovertarget="namepop" data-i18n-aria="yourName"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg><span id="namechip"></span></button>
      <div id="namepop" popover><label><span data-i18n="yourName">Your name</span><input id="name" maxlength="40" autocomplete="nickname"></label></div>
      <a id="new" class="button" data-i18n="new">New</a>
      <button id="copy" data-i18n="copyLink">Copy link</button>
      <button id="qr" popovertarget="qrpop" data-i18n-aria="qr" title="QR"><svg class="i" aria-hidden="true"><use href="#i-qr"/></svg></button>
      <div id="qrpop" popover data-i18n-aria="qr"><canvas id="qrcanvas" data-i18n-aria="qrImage" role="img"></canvas><small id="qrtext"></small><small data-i18n="toolLinkNote"></small></div>
    </span>
  </div>
</header>
<main id="app"></main>

<template id="tpl-home">
<section id="home" aria-labelledby="homename">
  <header><img id="homelogo" alt="" hidden><h1 id="homename"></h1><p id="tagline"></p></header>
  <nav id="toolgrid" data-i18n-aria="tools"></nav>
  <p id="keynote"></p>
  <p id="intro" hidden></p>
  <nav id="homelinks" data-i18n-aria="siteLinks" hidden></nav>
</section>
</template>

<template id="tpl-meet">
<section id="prejoin" class="card" aria-labelledby="title">
  <small id="subtitle" data-i18n="subtitle">Link-based end-to-end encrypted call.</small>
  <small id="relaynote" hidden data-i18n="relayNote"></small>
  <input id="pname" autocomplete="name" maxlength="40" data-i18n-ph="yourName" data-i18n-aria="yourName">
  <details id="advanced">
    <summary data-i18n="advanced">Advanced</summary>
    <fieldset id="modes">
      <legend data-i18n="mediaPath">Media path</legend>
      <div class="segmented">
        <label><input type="radio" name="mode" id="mode-relay" checked><span data-i18n="relay">Server</span></label>
        <label><input type="radio" name="mode" id="mode-p2p"><span data-i18n="p2p">P2P</span></label>
      </div>
    </fieldset>
    <label><span data-i18n="relayServer">Relay server</span> <input id="server" autocomplete="off" spellcheck="false"></label>
    <label><span data-i18n="iceServers">ICE servers</span> <textarea id="ice" rows="3" spellcheck="false"></textarea></label>
    <small id="adverr" role="alert"></small>
  </details>
  <button id="join" class="primary" data-i18n="join">Join call</button>
  <small id="err" role="alert"></small>
</section>
<section id="call" hidden data-i18n-aria="call">
  <main>
    <h1 id="calltitle" class="sr"></h1>
    <div id="stage">
      <div id="tiles"></div>
    </div>
    <div id="bar" role="toolbar" data-i18n-aria="controls">
      <button id="mic" data-i18n-aria="mute" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-mic"/></svg><span data-i18n="mic">Mic</span></button>
      <button id="camb" data-i18n-aria="camOff" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-cam"/></svg><span data-i18n="cam">Cam</span></button>
      <span id="mainext"></span>
      <button id="toolsb" popovertarget="toolsmenu" data-i18n-aria="tools"><svg class="i" aria-hidden="true"><use href="#i-tools"/></svg><span data-i18n="toolsLabel">Tools</span></button>
      <button id="settingsb" popovertarget="settingsmenu" data-i18n-aria="settings"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg><span data-i18n="settingsLabel">Settings</span><span id="unread" class="badge" hidden></span></button>
      <button id="toast" class="toast" hidden></button>
      <button id="leave" class="danger" data-i18n-aria="leaveCall"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg><span data-i18n="leave">Leave</span></button>
      <span id="status" role="status" aria-live="polite"></span>
      <div id="toolsmenu" class="menu" popover role="group" data-i18n-aria="tools">
        <button id="share" data-i18n-aria="shareScreen" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-screen"/></svg><span data-i18n="share">Share</span></button>
        <span id="extbar"></span>
      </div>
      <div id="settingsmenu" class="menu" popover role="group" data-i18n-aria="settings">
        <button id="chatb" data-i18n-aria="toggleChat" aria-pressed="true"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg><span data-i18n="chat">Chat</span></button>
        <button id="blurb" data-i18n-aria="blur" aria-pressed="false" hidden><svg class="i" aria-hidden="true"><use href="#i-blur"/></svg><span data-i18n="blurLabel">Blur background</span></button>
        <span id="extsettings"></span>
        <button id="copy2"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg><span data-i18n="copyLink">Copy link</span></button>
        <button class="theme" data-i18n-aria="theme"><svg class="i" aria-hidden="true"><use href="#i-theme"/></svg><span data-i18n="themeLabel">Theme</span></button>
      </div>
    </div>
  </main>
  <aside id="chat" data-i18n-aria="chat">
    <div id="messages" role="log" aria-live="polite"></div>
    <form id="chatform"><input id="msg" data-i18n-ph="message" data-i18n-aria="message" maxlength="2000" autocomplete="off"><button type="submit" data-i18n="send">Send</button></form>
  </aside>
</section>
</template>

<template id="tpl-when">
<section id="create" class="card narrow" aria-labelledby="title" hidden>
  <small data-i18n="whenSubtitle">Find a time that works for everyone. End-to-end encrypted, by link.</small>
  <label><span data-i18n="eventName">Event name</span><input id="ename" maxlength="100" autocomplete="off"></label>
  <div id="cal" role="group" aria-labelledby="calhint">
    <small id="calhint" data-i18n="calHint">Pick the days: click, drag, or shift-click for a range.</small>
    <div class="calhead"><button id="prev" class="icon-btn" data-i18n-aria="prevMonth">‹</button><b id="month" aria-live="polite"></b><button id="next" class="icon-btn" data-i18n-aria="nextMonth">›</button></div>
    <div id="days"></div>
  </div>
  <div class="row">
    <label><span data-i18n="from">From</span><select id="start"></select></label>
    <label><span data-i18n="to">To</span><select id="end"></select></label>
    <label><span data-i18n="length">Meeting length</span><select id="len"></select></label>
  </div>
  <label><span data-i18n="answerByOpt">Answer by (optional)</span><input id="by" type="date"></label>
  <div class="tz" id="ctz"></div>
  <button id="go" class="primary" data-i18n="create">Create event</button>
  <small id="err" role="alert"></small>
</section>
<section id="event" class="card wide" hidden>
  <div class="row between">
    <div class="segmented" role="radiogroup" data-i18n-aria="view">
      <label><input type="radio" name="tab" id="tab-you" checked><span data-i18n="yourAvailability">Your availability</span></label>
      <label><input type="radio" name="tab" id="tab-group"><span id="grouplabel"></span></label>
    </div>
    <div class="tz" id="vtz"></div>
  </div>
  <section id="you" aria-labelledby="tab-you">
    <p id="sent" role="status"></p>
    <form id="answer">
      <div class="row center">
        <label><span data-i18n="yourName">Your name</span><input id="aname" maxlength="40" autocomplete="name" required></label>
        <button type="submit" class="primary" data-i18n="send">Send</button>
      </div>
      <small id="senderr" role="alert"></small>
    </form>
    <div id="editor" class="grid" role="group" data-i18n-aria="gridLabel"></div>
  </section>
  <section id="group" aria-labelledby="tab-group" hidden>
    <div class="row center">
      <div class="legend" aria-hidden="true"><span id="legendmin"></span><span class="bar"></span><span id="legendmax"></span></div>
      <ul id="people" data-i18n-aria="answers"></ul>
    </div>
    <div id="heat" class="grid" role="img" data-i18n-aria="heatLabel"></div>
    <p id="who"></p>
    <div id="bestbox"><b data-i18n="best">Best times</b><ul id="best"></ul></div>
  </section>
</section>
</template>

<template id="tpl-form">
<section id="build" class="card narrow" aria-labelledby="title" hidden>
  <small data-i18n="formSubtitle"></small>
  <label><span data-i18n="formTitle">Title</span><input id="ftitle" maxlength="200" autocomplete="off" required></label>
  <div id="fields"></div>
  <button id="addfield" type="button"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addField">Add a question</span></button>
  <div class="settings">
    <label class="check"><input id="openres" type="checkbox"><span data-i18n="openResults">Results visible to everyone with the link</span></label>
    <label><span data-i18n="answerByOpt">Answer by (optional)</span><input id="by" type="date"></label>
  </div>
  <button id="go" class="primary" data-i18n="createForm">Create form</button>
  <small id="err" role="alert"></small>
</section>
<div id="fill" class="stack" hidden>
  <section id="share" class="card" aria-labelledby="sharetitle" hidden>
    <h2 id="sharetitle" data-i18n="shareTitle">Share</h2>
    <div class="linkrow"><code id="publiclink"></code><button id="copypublic" data-i18n="copy">Copy</button><small data-i18n="publicHint">Send this link to the people who should answer.</small></div>
    <div class="linkrow"><code id="ownerlink"></code><button id="copyowner" data-i18n="copy">Copy</button><small data-i18n="ownerHint">Your owner link: it holds the key that opens the answers. Keep it private.</small></div>
  </section>
  <section class="card" aria-labelledby="title">
    <p id="sent" role="status"></p>
    <form id="answer">
      <div id="questions"></div>
      <button type="submit" class="primary" data-i18n="send">Send</button>
      <small id="senderr" role="alert"></small>
    </form>
    <small id="locked" hidden data-i18n="lockedResults">Only the owner sees the answers.</small>
    <p id="waiting" hidden class="muted" data-i18n="waiting">Waiting for the presenter to show the results.</p>
  </section>
  <section id="results" class="card" aria-labelledby="rtitle" hidden>
    <div class="row head"><div><h2 id="rtitle" data-i18n="results">Results</h2><small id="rcount"></small></div><span class="tools"><button id="present" hidden><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span data-i18n="present">Present</span></button><button id="csv" data-i18n="csv">Download CSV</button></span></div>
    <p id="empty" class="empty" data-i18n="noAnswers">No answers yet.</p>
    <div id="tallies"></div>
    <div class="scroll"><table id="table"></table></div>
  </section>
</div>
<div id="fpresent" tabindex="-1" hidden data-i18n-aria="presentResults">
  <div id="fpmain"><h2 id="fpqtitle"></h2><div id="fpviz" aria-live="polite"></div></div>
  <aside id="fpjoin"><canvas id="fpqr" role="img" data-i18n-aria="qrImage"></canvas><small data-i18n="scan">Scan to answer</small><small id="fplink"></small></aside>
  <div id="fpbar"><button id="fpprev" class="icon-btn" data-i18n-aria="prevQuestion">‹</button><span id="fpcount"></span><button id="fpreveal" aria-pressed="false"></button><button id="fpnext" class="icon-btn" data-i18n-aria="nextQuestion">›</button><button id="fpexit" data-i18n="exit">Exit (Esc)</button></div>
</div>
</template>

<template id="tpl-pad">
<div id="histbar" class="row" hidden><span id="histwhen"></span><button id="histrestore" class="primary" data-i18n="restore">Restore this version</button><button id="histback" data-i18n="back">Back to the live pad</button></div>
<div id="uploads" class="uploads" hidden data-i18n-aria="uploads"></div>
<main id="padmain" data-view="both">
  <div id="editwrap">
    <div id="marks" role="img"></div>
    <textarea id="editor" readonly spellcheck="false" autocomplete="off" data-i18n-aria="padLabel"></textarea>
  </div>
  <nav id="toc" hidden data-i18n-aria="contents"></nav>
  <div id="preview" data-i18n-aria="previewLabel"></div>
  <aside id="padfiles" hidden data-i18n-aria="filesPanel"><ul id="padfilelist"></ul><p id="padfilesempty" class="muted" data-i18n="noFiles"></p></aside>
  <aside id="padcomments" hidden data-i18n-aria="comments"><button id="commenton" class="tonal" data-i18n="commentOn">Comment on the selection</button><form id="commentform" hidden><textarea id="commenttext" rows="3" maxlength="2000" data-i18n-ph="commentPh" data-i18n-aria="commentPh"></textarea><div class="row"><button type="submit" class="primary" data-i18n="post">Post</button><button type="button" id="commentcancel" data-i18n="cancel">Cancel</button></div></form><p id="threadsempty" class="muted" data-i18n="noComments"></p><div id="threadlist"></div><details id="resolved" hidden><summary></summary><div></div></details></aside>
</main>
<div id="present-view" tabindex="-1" hidden>
  <div id="slide" class="slide"></div>
  <div id="slidebar"><span id="slidenav"></span><button id="exit" data-i18n="exit">Exit (Esc)</button></div>
</div>
</template>

<template id="tpl-share">
<section class="card wide">
  <small data-i18n="shareSubtitle">Encrypted in your browser. Anyone with the link can add and download.</small>
  <div id="drop" class="drop" tabindex="0" role="button" data-i18n-aria="dropLabel">
    <span data-i18n="dropHint">Drop files here or</span> <label class="button"><span data-i18n="choose">choose files</span><input id="file" type="file" multiple hidden></label>
  </div>
  <div id="uploads" class="uploads" hidden data-i18n-aria="uploads"></div>
  <ul id="files" data-i18n-aria="filesLabel"></ul>
  <p id="empty" data-i18n="noFiles">No files yet.</p>
</section>
</template>

<script type="module" src="/ui/main.js"></script>
